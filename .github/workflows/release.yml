name: Release

# Tagging a version builds the Windows bundles and publishes them as that tag's
# release. Bump the version in src-tauri/tauri.conf.json first — tauri-action
# names the artifacts after it, and the tag must match v<version>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build Windows bundles
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action bundles what tauri.conf.json names in bundle.externalBin,
      # and that file only exists once the shim has been built and copied.
      - name: Build the tool shim
        run: npm run tools:shim

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "The tag must match the Desktop version $tag"
          }
          $path = ".github/release-notes/$tag.md"
          $body = if (Test-Path -LiteralPath $path) {
            Get-Content -Raw -LiteralPath $path
          } else {
            "Windows installers for Nova Desktop $tag. Requires WebView2 and Python 3 on PATH for the terminal dock."
          }
          $delimiter = [guid]::NewGuid().ToString('N')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @("body<<$delimiter", $body.TrimEnd(), $delimiter)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of the key whose public half sits in
          # tauri.conf.json (plugins.updater.pubkey). Without it the bundles are
          # unsigned and every installed Nova refuses to update to them; signed
          # with any other key, the same refusal, so this is the one secret the
          # release cannot be recreated without.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Nova Desktop v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published, not a draft: a tag is the release decision. Flip to true if a
          # release should wait for a human to press publish.
          releaseDraft: false
          prerelease: false
          # latest.json is the manifest the app polls
          # (plugins.updater.endpoints). Uploading it is the default, and naming
          # it here keeps a future default from quietly turning it off. The
          # input is `includeUpdaterJson`; `uploadUpdaterJson` is silently
          # ignored, and the v0.5.0 run proved it — the warning sat in the job
          # annotations while the manifest uploaded on the default alone.
          # The bundle type is detected at runtime, so the platforms object has
          # to carry both windows-x86_64-nsis and windows-x86_64-msi.
          includeUpdaterJson: true
