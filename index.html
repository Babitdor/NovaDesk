<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The window chrome takes the plate's own ground, not the platform default. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030e3e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fad9b6" />
    <title>Nova Desktop</title>
    <!--
      The boot curtain is inline on purpose: it has to paint before the bundle, the
      fonts and the first React commit, or the window opens on an empty plate. It is
      removed by src/main.tsx once a frame is actually on screen.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #050a2a; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background:
          radial-gradient(120% 80% at 50% 32%, #22306f 0%, #101a4d 46%, #050a2a 100%);
        color: #f6e9da;
        font-family: ui-serif, "Iowan Old Style", Georgia, serif;
        transition: opacity 340ms ease, visibility 340ms;
      }
      #boot[data-done="true"] { opacity: 0; visibility: hidden; }
      /* The ring that used to spin around a sparkle now lives in the badge itself,
         so the mark breathes instead of turning. */
      .boot-mark { width: 96px; height: 96px; display: grid; place-items: center; }
      .boot-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
        box-shadow: 0 18px 46px rgba(2, 8, 40, 0.55);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      .boot-word { margin: 0; font-size: 21px; letter-spacing: 0.34em; text-transform: uppercase; text-indent: 0.34em; }
      .boot-hint { margin: 0; font: 11px ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #9fb0e6; }
      .boot-bar { width: 148px; height: 1px; background: rgba(159, 176, 230, 0.22); overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #f7b98a; animation: boot-bar 1.25s ease-in-out infinite; }
      @keyframes boot-breathe { 0%, 100% { opacity: 0.65; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes boot-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-color-scheme: light) {
        html, body { background: #fad9b6; }
        #boot { background: radial-gradient(120% 80% at 50% 32%, #fff3e4 0%, #fad9b6 55%, #f0c39a 100%); color: #3a2418; }
        .boot-hint { color: #8a6544; }
        /* The badge's cream ground sits on a cream curtain; a navy glow reads as a
           smudge, so the light theme casts a warm one instead. */
        .boot-logo { box-shadow: 0 12px 28px rgba(58, 36, 24, 0.22); }
        .boot-bar { background: rgba(138, 101, 68, 0.25); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-bar i { animation-duration: 0s; animation-iteration-count: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Starting Nova Desktop">
      <div class="boot-mark">
        <img class="boot-logo" src="/nova.webp" alt="" width="96" height="96" />
      </div>
      <p class="boot-word">Nova</p>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <p class="boot-hint">Opening your workspace</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
