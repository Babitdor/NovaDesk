[workspace]
# The tool shim is a member rather than a [[bin]] of this package: Tauri
# validates bundle.externalBin while this crate's build script runs, so the file
# has to exist before this crate can compile, and a binary inside this package
# could never satisfy that (building it would run the same build script).
members = ["shim"]

[package]
name = "novacode-desktop"
version = "0.9.0"
description = "Nova Desktop — a Tauri shell for a desktop coding agent"
edition = "2021"
# 1.90 is tauri-plugin-updater's floor: the crate uses APIs stabilized there.
# The toolchains here and in CI are well past it; this is a compile-time
# requirement, not a Windows one, so the shipped MSI is unaffected.
rust-version = "1.90"

[lib]
name = "novacode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ort-sys 2.0.0-rc.12 (pinned by transcribe-rs) panics while copying ONNX
# Runtime's dylibs under current cargo's nested build layout; the vendored copy
# fixes that one build script. See vendor/ort-sys/build/dynamic_link.rs.
[patch.crates-io]
ort-sys = { path = "vendor/ort-sys" }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
# The quick launcher's global chord. 2.4 requires tauri ^2.12, which the lock
# already resolves; no npm package is needed because the page only calls the
# commands in commands/launcher.rs.
tauri-plugin-global-shortcut = "2"
# Signature-verified in-app updates. Only the Rust API is used: commands/app.rs
# runs check → download → verify → install, so the webview never gets the
# plugin's JS commands and capabilities/default.json stays core-only. The
# public key and endpoint live in tauri.conf.json under plugins.updater.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps Map insertion order: the managed nova-desktop entry in
# a workspace's .nova/mcp.json is merged, never rewritten with sorted keys —
# a reordered file would defeat the byte-identical skip and churn the user's
# config on every session.
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "macros", "fs", "net"] }
tokio-util = "0.7"
# On-device speech-to-text. The "onnx" feature pulls ort, ndarray and rustfft;
# "whisper-cpp" pulls whisper-rs, which compiles whisper.cpp with CMake and
# generates the bindings with bindgen, so every build machine (CI included)
# needs CMake + libclang and the binary grows by a few MB. The models
# themselves are downloaded at runtime, never bundled.
transcribe-rs = { version = "0.3", features = ["onnx", "whisper-cpp"] }
# Feature unification with transcribe-rs turns on ort's prebuilt runtime
# download and its copy-dylibs step, so onnxruntime.dll lands beside the exe.
# Pinned exactly: transcribe-rs 0.3.12 calls ort's rc.12 session API, and
# rc.13+ changed it (Session::builder now needs an Environment).
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
# Transfers go through the system curl (same helper the theme installer uses);
# these three handle the tar.gz model archives and the base64 sample transport.
flate2 = "1"
tar = "0.4"
base64 = "0.22"
# On-device text-to-speech runs Piper's own prebuilt binary, downloaded next to
# the voice the first time one is installed. Linking piper-rs instead would drag
# in espeak-rs-sys, which needs libclang (bindgen) and CMake on every build
# machine and would put GPLv3 espeak-ng inside this executable; the release zip
# keeps both concerns outside the build. Added for the speech work below.
zip = { version = "2", default-features = false, features = ["deflate"] }

# The browser pane's screenshot goes through WebView2's own DevTools protocol
# (Page.captureScreenshot), which needs the controller Tauri already holds. Both
# crates are already in the tree through wry at exactly these versions, so this
# adds no build time — only the bindings, which were previously unreachable.
#
# nova-tools is a second binary in this package (src/bin/nova-tools.rs). It is
# deliberately dependency-free: it links nothing from the app, so building it
# costs a fraction of a second and a harness starts it on every turn.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
