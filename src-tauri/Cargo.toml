[package]
name = "novacode-desktop"
version = "0.1.2"
description = "Nova Desktop — a Tauri shell for a desktop coding agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "novacode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "macros", "fs"] }
tokio-util = "0.7"
